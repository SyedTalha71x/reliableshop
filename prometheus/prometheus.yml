global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "reliableshop-local"
    env: "dev"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "orders-service"
    static_configs:
      - targets: ["orders:5001"]
    metrics_path: /metrics

  - job_name: "payments-service"
    static_configs:
      - targets: ["payments:5002"]
    metrics_path: /metrics

  - job_name: "products-service"
    static_configs:
      - targets: ["products:5003"]
    metrics_path: /metrics

  - job_name: "cart-service"
    static_configs:
      - targets: ["cart:5004"]
    metrics_path: /metrics

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["nginx-exporter:9113"]